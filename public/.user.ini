; PHP upload limits for floor plan images and other file uploads
; Required for: floor plan images, booth images, documents, etc.
; Note: php artisan serve ignores .user.ini - use php.ini or run: php -d upload_max_filesize=20M -d post_max_size=25M artisan serve
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120
memory_limit = 256M

; Blade compiler uses PCRE regex; the booths/index view is ~950KB and
; exceeds the default 1M backtrack limit, causing silent compile failure.
pcre.backtrack_limit = 10000000
pcre.recursion_limit = 500000
